server:
  port: 8080
  tomcat:
    max-threads: 200
    min-spare-threads: 10
    max-connections: 10000
    accept-count: 100

spring:
  # 生产环境使用caffeine缓存
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=600s

# 生产环境日志配置
logging:
  level:
    root: WARN
    com.chinese.culture: INFO
  file:
    max-size: 100MB
    max-history: 30

# 生产环境禁用Swagger
springfox:
  documentation:
    swagger-ui:
      enabled: false

# 生产环境自定义配置
app:
  # 生产环境启用限流
  rate-limit:
    enabled: true
    default-limit: 100  # 每秒请求数
    default-period: 1   # 时间周期（秒）
  # 生产环境线程池配置
  thread-pool:
    core-size: 10
    max-size: 20
    queue-capacity: 100
    keep-alive-seconds: 300 