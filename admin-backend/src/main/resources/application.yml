server:
  port: 8080
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 2048

spring:
  profiles:
    active: dev
  application:
    name: chinese-culture-admin
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

# Swagger配置
springfox:
  documentation:
    enabled: true
    swagger-ui:
      enabled: true
    open-api:
      enabled: true

# 日志配置
logging:
  level:
    root: INFO
    com.chinese.culture: DEBUG
  file:
    path: logs
    name: ${spring.application.name}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"

# 自定义配置
app:
  # 线程池配置
  thread-pool:
    core-size: 5
    max-size: 10
    queue-capacity: 25
    keep-alive-seconds: 60
    thread-name-prefix: Async-
  # 接口限流配置
  rate-limit:
    enabled: true
    default-limit: 10
    default-period: 1 